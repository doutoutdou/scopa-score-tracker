<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="512" height="512" rx="115" fill="url(#gradient)"/>

  <!-- Playing cards stack -->
  <!-- Card 3 (back) -->
  <rect x="140" y="180" width="200" height="280" rx="20" fill="#FEF3C7" opacity="0.6" transform="rotate(-15 240 320)"/>

  <!-- Card 2 (middle) -->
  <rect x="150" y="160" width="200" height="280" rx="20" fill="#FDE68A" opacity="0.8" transform="rotate(-8 250 300)"/>

  <!-- Card 1 (front) -->
  <rect x="160" y="140" width="200" height="280" rx="20" fill="white" stroke="#DC2626" stroke-width="8"/>

  <!-- Card suit symbol - Diamond -->
  <path d="M260 200 L290 250 L260 300 L230 250 Z" fill="#DC2626"/>

  <!-- Number 7 -->
  <text x="185" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#DC2626">7</text>

  <!-- Trophy icon for scoring -->
  <g transform="translate(230, 320)">
    <path d="M0 0 L20 0 L20 15 C20 25 15 30 10 30 C5 30 0 25 0 15 Z" fill="#F59E0B"/>
    <rect x="-3" y="30" width="26" height="8" rx="2" fill="#F59E0B"/>
    <rect x="3" y="38" width="14" height="4" fill="#F59E0B"/>
    <circle cx="5" cy="8" r="6" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="15" cy="8" r="6" fill="none" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Decorative elements -->
  <text x="180" y="390" font-family="Arial, sans-serif" font-size="20" fill="#DC2626" opacity="0.3">♠</text>
  <text x="320" y="390" font-family="Arial, sans-serif" font-size="20" fill="#DC2626" opacity="0.3">♣</text>
  <text x="180" y="180" font-family="Arial, sans-serif" font-size="20" fill="#DC2626" opacity="0.3">♥</text>
  <text x="320" y="180" font-family="Arial, sans-serif" font-size="20" fill="#DC2626" opacity="0.3">♦</text>

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FDE68A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCD34D;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
